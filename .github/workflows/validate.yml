name: Validate Portfolio Data & Code

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JSON Data Schemas
        run: node scripts/validate-data.js

      - name: Verify HTML & JS Syntax
        run: |
          node -e '
          import fs from "node:fs";
          
 // Check required HTML and validate admin HTML when present
 const files = ["index.html"];

 if (fs.existsSync("admin/index.html")) {
   files.push("admin/index.html");
 }

 for (const file of files) {
   const html = fs.readFileSync(file, "utf8");

   if (!html.includes("<!DOCTYPE html>")) {
     throw new Error(`${file} must contain a valid DOCTYPE`);
   }
 }

 console.log("HTML integrity check passed.");
